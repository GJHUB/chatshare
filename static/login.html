<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatShare - 登录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body.login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family: "Segoe UI", "PingFang SC", sans-serif;color:#e8e8f0;
  background:#1a1b2e;
  background-image:radial-gradient(ellipse at 30% 20%, rgba(16,163,127,.12) 0%, transparent 50%),radial-gradient(ellipse at 70% 80%, rgba(14,165,233,.08) 0%, transparent 50%);
}
.card{background:rgba(37,38,64,.8);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:44px 36px;width:100%;max-width:420px;box-shadow:0 16px 48px rgba(0,0,0,.3)}
h1{font-size:28px;font-weight:700;margin-bottom:8px;text-align:center;background:linear-gradient(135deg,#10a37f,#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#8888a8;font-size:14px;text-align:center;margin-bottom:28px}
.tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:24px}
.tab{flex:1;padding:10px;text-align:center;cursor:pointer;color:#8888a8;font-size:14px;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:#e8e8f0;border-bottom-color:#10a37f}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;color:#8888a8;margin-bottom:6px}
input{width:100%;padding:12px 14px;background:rgba(20,21,36,.6);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#e8e8f0;font-size:14px;outline:none;transition:border-color .3s,box-shadow .3s}
input:focus{border-color:#10a37f;box-shadow:0 0 0 3px rgba(16,163,127,.15)}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#10a37f,#0ea5e9);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(16,163,127,.3)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.error{color:#f87171;font-size:13px;margin-top:10px;text-align:center;min-height:20px}
</style>
</head>
<body class="login-page">
<div class="card">
  <h1>ChatShare</h1>
  <p class="subtitle">AI 对话平台</p>
  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">登录</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">注册</div>
  </div>
  <div id="form-login">
    <div class="form-group"><label>用户名</label><input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username"></div>
    <div class="form-group"><label>密码</label><input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password"></div>
    <button class="btn" id="btn-login" onclick="doLogin()">登录</button>
    <div class="error" id="login-error"></div>
  </div>
  <div id="form-register" style="display:none">
    <div class="form-group"><label>用户名</label><input type="text" id="reg-username" placeholder="3-20个字符" autocomplete="username"></div>
    <div class="form-group"><label>昵称（可选）</label><input type="text" id="reg-nickname" placeholder="显示名称"></div>
    <div class="form-group"><label>密码</label><input type="password" id="reg-password" placeholder="至少6位" autocomplete="new-password"></div>
    <button class="btn" id="btn-register" onclick="doRegister()">注册</button>
    <div class="error" id="reg-error"></div>
  </div>
</div>
<script>
function switchTab(tab) {
  document.getElementById('form-login').style.display = tab==='login'?'':'none';
  document.getElementById('form-register').style.display = tab==='register'?'':'none';
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
}
async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = '请填写用户名和密码'; return; }
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password}) });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.detail||'登录失败'; return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = '/';
  } catch(e) { errEl.textContent = '网络错误，请重试'; }
  finally { btn.disabled=false; btn.textContent='登录'; }
}
async function doRegister() {
  const username = document.getElementById('reg-username').value.trim();
  const nickname = document.getElementById('reg-nickname').value.trim();
  const password = document.getElementById('reg-password').value;
  const errEl = document.getElementById('reg-error');
  const btn = document.getElementById('btn-register');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = '请填写用户名和密码'; return; }
  if (password.length < 6) { errEl.textContent = '密码至少6位'; return; }
  btn.disabled = true; btn.textContent = '注册中...';
  try {
    const res = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password,nickname:nickname||undefined}) });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.detail||'注册失败'; return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = '/';
  } catch(e) { errEl.textContent = '网络错误，请重试'; }
  finally { btn.disabled=false; btn.textContent='注册'; }
}
document.addEventListener('keydown', e => {
  if (e.key==='Enter') {
    if (document.getElementById('form-login').style.display!=='none') doLogin(); else doRegister();
  }
});
if (localStorage.getItem('token')) window.location.href = '/';
</script>
</body>
</html>
