<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咕嘟</title>
<link rel="stylesheet" href="/static/css/style.css?v=3.0.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8D%B2%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="new-chat-btn" id="btn-new-chat" onclick="newConversation()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新聊天
      </button>
    </div>
    <div class="sidebar-search">
      <input type="text" id="search-input" placeholder="搜索聊天">
    </div>
    <div class="sidebar-label">你的聊天</div>
    <div class="conv-list" id="conv-list"></div>
    <div class="sidebar-bottom">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">U</div>
        <div class="user-details">
          <div class="user-name" id="user-name">用户</div>
          <div class="user-plan">Pro</div>
        </div>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="切换主题">🌙</button>
        <button class="logout-btn" onclick="logout()">退出</button>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main" id="main">
    <button class="hamburger" onclick="toggleSidebar()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <!-- Model selector -->
    <div class="model-bar">
      <div class="brand-chip">🍲 咕嘟</div>
      <div style="position:relative;display:inline-block">
        <button class="model-selector-btn" id="model-selector-btn" onclick="toggleModelDropdown(event)">
          <span id="model-name-display">GPT-4o</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="model-dropdown" id="model-dropdown" style="display:none"></div>
      </div>
      <select id="preset-select" class="preset-select" onchange="changePreset(this.value)" title="界面风格">
        <option value="forest">森林绿</option>
        <option value="mint">薄荷青</option>
        <option value="graphite">石墨灰</option>
        <option value="classic">经典蓝</option>
      </select>
      <button id="minimap-toggle" class="minimap-toggle" onclick="toggleMiniMap()" title="缩略导航">🗺️</button>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🍲</div>
        <h2>有什么可以帮你的？</h2>
        <p>选择模型，开始你的 AI 之旅</p>
        <div class="quick-prompts">
          <div class="quick-prompt-card" data-prompt="帮我写一个 Python 脚本来整理日志文件">
            <div class="icon">💡</div><div class="title">写代码</div><div class="desc">帮我写一个 Python 脚本</div>
          </div>
          <div class="quick-prompt-card" data-prompt="帮我写一篇关于 AI 代理设计的短文">
            <div class="icon">📝</div><div class="title">写文章</div><div class="desc">帮我写一篇关于AI的短文</div>
          </div>
          <div class="quick-prompt-card" data-prompt="生成一张未来城市夜景图片">
            <div class="icon">🎨</div><div class="title">画图片</div><div class="desc">生成一张未来城市夜景</div>
          </div>
        </div>
      </div>
    </div>

    <div id="minimap" class="minimap hidden">
      <div id="minimap-track" class="minimap-track"></div>
      <div id="minimap-viewport" class="minimap-viewport"></div>
    </div>

    <button id="scroll-to-bottom-btn" class="scroll-to-bottom-btn hidden" onclick="jumpToBottom()">回到底部（有新内容）</button>

    <!-- Input -->
    <div class="input-area">
      <div id="file-preview-area" class="file-preview-area hidden"></div>
      <div class="input-wrap">
        <div class="attach-wrap">
          <button class="attach-btn" onclick="toggleUploadMenu()" title="上传文件">+</button>
          <div class="upload-menu hidden" id="upload-menu">
            <div class="upload-menu-item" onclick="openFileSelector()">📎 上传文件</div>
          </div>
        </div>
        <textarea id="msg-input" placeholder="询问任何问题" rows="1"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg id="send-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="input-hint">Enter 发送 · Shift+Enter 换行 · Ctrl+N 新对话</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/static/js/app.js?v=3.0.1"></script>
</body>
</html>
